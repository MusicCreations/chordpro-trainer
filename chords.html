<script>
function bPiano(){
    var c=document.getElementById('piano-container'); if(!c)return;
    c.innerHTML=''; keys=new Array();
    var wC=0;
    var bl = '1.3.6.8.10'.split('.').map(Number);

    var whiteKeysTemp = [];
    var blackKeysTemp = [];

    for(var i=0; i<38; i++){
        var nI=i%12;
        if(bl.indexOf(nI)===-1){
            var k=document.createElement('div'); k.className='key white'; k.dataset.idx=i;
            for(var s=2; s>=0; s--){var d=document.createElement('div'); d.className='dot dot-'+s; k.appendChild(d)}
            keys.push({el:k, f:123.48*Math.pow(2,i/12), nI:nI});
            whiteKeysTemp.push(k);
            wC++;

            if(bl.indexOf((i+1)%12)!==-1 && (i+1)<38){
                var b=document.createElement('div'); b.className='key black'; b.dataset.idx=i+1;
                b.style.left = (wC * (100 / 22)) + "%";
                for(var s2=2; s2>=0; s2--){var d2=document.createElement('div'); d2.className='dot dot-'+s2; b.appendChild(d2)}
                keys.push({el:b, f:123.48*Math.pow(2,(i+1)/12), nI:(i+1)%12});
                blackKeysTemp.push(b);
            }
            if(wC >= 22) break;
        }
    }

    whiteKeysTemp.forEach(function(wk){ c.appendChild(wk); });
    blackKeysTemp.forEach(function(bk){ c.appendChild(bk); });
}

function pN(f,d,t){
    if(curCat === 'ext') return;
    if(!t) t=0;
    if(!ctx){
        ctx=new(window.AudioContext||window.webkitAudioContext)();
        gain=ctx.createGain();
        gain.connect(ctx.destination);
    }
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle";
    o.frequency.setValueAtTime(f,ctx.currentTime+t);

    var startTime = ctx.currentTime + t;
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.12, startTime + 0.05);
    g.gain.setValueAtTime(0.12, startTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.01, startTime + d);

    o.connect(g);
    g.connect(gain);
    o.start(startTime);
    o.stop(startTime + d);
}

var chromaticReferenceNotes = 'C,C#,D,D#,E,F,F#,G,G#,A,A#,B'.split(',');
function getMidiIdx(name) {
    if(!name) return -1;
    var raw = name.replace('Db','C#').replace('Eb','D#').replace('Gb','F#').replace('Ab','G#').replace('Bb','A#')
                 .replace('Do','C').replace('Ré','D').replace('Mi','E').replace('Fa','F').replace('Sol','G').replace('La','A').replace('Si','B');
    return chromaticReferenceNotes.indexOf(raw);
}

function playChord(notes, uS, delay){
    if(curCat === 'ext') return; if(!delay) delay=0;
    for(var j=0; j<notes.length; j++){
        var nI = getMidiIdx(notes[j]) % 12; if(nI < 0) continue;

            if(keys[m].nI===nI && keys[m].f>150){
                pN(keys[m].f,1.5,delay);
                break;
            }
        }
    }
}

<script>
function parseInterval(symbol) {
    var mod = 'N';
    var degStr = symbol;
    if (symbol.charAt(0) === 'b') {
        mod = 'b';
        degStr = symbol.substring(1);
    } else if (symbol.charAt(0) === '#') {
        mod = '#';
        degStr = symbol.substring(1);
    }
    return { deg: parseInt(degStr, 10), mod: mod };
}

function getScaleNoteSafe(scaleArray, degree) {
    if (!scaleArray) return "C";
    if (degree < scaleArray.length) {
        return scaleArray[degree];
    }
    var adjustedDegree = ((degree - 1) % 7) + 1;
    return scaleArray[adjustedDegree];
}

function getN(rName, id, cat) {
    var sc = scaleTable[rName];
    var trackingId = (cat === 'vab' ? 'v_' + id : id);
    var intervals = chordModTable[trackingId] || ['1', '3', '5'];
    var suf = "";
    var vSel = document.getElementById('voice-select').value;
    var tSel = document.getElementById('triad-note-select').value;

    if (cat === 'triad') {
        var pick = 0;
        if (tSel === '1') pick = 0;
        else if (tSel === '3') pick = 1;
        else if (tSel === '5') pick = 2;
        else pick = Math.floor(Math.random() * 3);

        var pairedItems = [];
        for (var i = 0; i < intervals.length; i++) {
            pairedItems.push(parseInterval(intervals[i]));
        }

        if (pick > 0) {
            for (var p = 0; p < pick; p++) {
                var item = pairedItems.shift();
                item.deg += 7;
                pairedItems.push(item);
            }
            pairedItems.sort(function(a, b) { return a.deg - b.deg; });
            suf = " (" + (pick === 1 ? '3' : '5') + ")";
        } else {
            suf = " (1)";
        }

        var finalNotes = [];
        for (var k = 0; k < pairedItems.length; k++) {
            var baseNote = getScaleNoteSafe(sc, pairedItems[k].deg);
            if (alterationTable[pairedItems[k].mod] && alterationTable[pairedItems[k].mod][baseNote]) {
                finalNotes.push(alterationTable[pairedItems[k].mod][baseNote]);
            } else {
                finalNotes.push(baseNote);
            }
        }
        return { n: finalNotes, suf: suf };

    } else if (cat === 'quad' || cat === 'ext') {
        var finalNotes = [];
        var activeMidiPitches = [];

        for (var i = 0; i < intervals.length; i++) {
            var item = parseInterval(intervals[i]);
            var baseNote = getScaleNoteSafe(sc, item.deg);
            var mappedPitch = (alterationTable[item.mod] && alterationTable[item.mod][baseNote]) ? alterationTable[item.mod][baseNote] : baseNote;

            var internalMidiIdx = getMidiIdx(mappedPitch) % 12;
            if (internalMidiIdx >= 0 && activeMidiPitches.indexOf(internalMidiIdx) === -1) {
                activeMidiPitches.push(internalMidiIdx);
                finalNotes.push(mappedPitch);
            }
        }
        return { n: finalNotes, suf: "" };

    } else if (cat === 'vab') {
        var vType = vSel;
        if (vSel === 'Synthetic') {
            var rMidi = getMidiIdx(rName) % 12;
            vType = (rMidi >= 0 && rMidi <= 4) ? '373' : '737';
        }
        var parsedArr = [];
        for (var i = 0; i < intervals.length; i++) {
            parsedArr.push(parseInterval(intervals[i]));
        }

        var idx3 = -1, idx5 = -1, idx7 = -1, idx9 = -1;
        for (var i = 0; i < parsedArr.length; i++) {
            var d = parsedArr[i].deg;
            if (d === 3 || d === 4) idx3 = i;
            else if (d === 5) idx5 = i;
            else if (d === 7 || d === 6) idx7 = i;
            else if (d === 9) idx9 = i;
        }

        var finalNotes = [];
        var order = (vType === '737') ? [idx7, idx9, idx3, idx5] : [idx3, idx5, idx7, idx9];
        for (var idx = 0; idx < 4; idx++) {
            var targetIdx = order[idx];
            if (targetIdx !== -1 && targetIdx !== undefined) {
                var item = parsedArr[targetIdx];
                var baseNote = getScaleNoteSafe(sc, item.deg);
                if (alterationTable[item.mod] && alterationTable[item.mod][baseNote]) {
                    finalNotes.push(alterationTable[item.mod][baseNote]);
                } else {
                    finalNotes.push(baseNote);
                }
            }
        }
        suf = " (" + vType + ")";
        return { n: finalNotes, suf: suf };
    }
}

function saveS(){try{var s={l:curL,r:document.getElementById('root-cb').checked,p:document.getElementById('play-cb').checked,a:document.getElementById('auto-cb').checked,v:document.getElementById('voice-select').value,tn:document.getElementById('triad-note-select').value,h:selH,c:chal,st:step,cc:curCat,hq:chordHistoryQueue}; localStorage.setItem('chordProCfg',JSON.stringify(s));}catch(e){}}
function loadS(){try{var s=JSON.parse(localStorage.getItem('chordProCfg'));if(s){curL=s.l;if(document.getElementById('lang-select'))document.getElementById('lang-select').value=s.l;if(document.getElementById('root-cb'))document.getElementById('root-cb').checked=s.r;if(document.getElementById('play-cb'))document.getElementById('play-cb').checked=s.p;if(document.getElementById('auto-cb'))document.getElementById('auto-cb').checked=s.a;if(s.v&&document.getElementById('voice-select'))document.getElementById('voice-select').value=s.v;if(s.tn&&document.getElementById('triad-note-select'))document.getElementById('triad-note-select').value=s.tn;selH=s.h||{};if(s.c){chal=s.c;step=s.st;curCat=s.cc;}if(s.hq)chordHistoryQueue=s.hq;}}catch(e){}}

function uType(cat){
    var r=document.getElementById('type-row'); if(!r) return; r.innerHTML=''; curCat=cat;
    var extOnly = document.getElementById('voice-select'); var triadOnly = document.getElementById('triad-note-select');
    if(extOnly) extOnly.style.display = (cat==='vab') ? 'block' : 'none';
    if(triadOnly) triadOnly.style.display = (cat==='triad') ? 'block' : 'none';
    var itemsList = cfg[cat] || [];
    itemsList.forEach(function(t){
        var b=document.createElement('button'); var isA=(selH[cat]&&selH[cat].indexOf(t.id)!==-1)||(!selH[cat]);
        b.className='type-toggle'+(isA?' active':''); b.dataset.id=t.id; b.innerText=t.l;
        b.onclick=function(){
            this.classList.toggle('active');
            var actives = [];
            var btns=r.querySelectorAll('.active');
            for(var i=0; i<btns.length; i++) actives.push(btns[i].dataset.id);
            if(!actives.length){this.classList.add('active'); actives=[t.id]}
            selH[cat]=actives;
            saveS();
            var btnNew = document.getElementById('btn-new');
            if (btnNew) btnNew.click();
        };
        r.appendChild(b);
    });
}

function tUI(){
    var t=i18n[curL] || i18n['EN']; var cats='triad,quad,ext,vab'.split(',');
    for(var i=0; i<cats.length; i++) { var el = document.getElementById('c-'+cats[i]); if(el) el.innerText=t[cats[i]]; }
    var labelNew = "NEW", labelConfirm = "CONFIRM", labelReplay = "REPLAY", labelReset = "RESET";
    if(curL === 'FR') { labelNew = "Nouveau"; labelConfirm = "Valider"; labelReplay = "Rejouer"; labelReset = "Réinitialiser"; }
    else if(curL === 'ES') { labelNew = "Nuevo"; labelConfirm = "Validar"; labelReplay = "Repetir"; labelReset = "Reiniciar"; }
    else if(curL === 'DE') { labelNew = "Neu"; labelConfirm = "Bestätigen"; labelReplay = "Wiederholen"; labelReset = "Zurücksetzen"; }
    else if(curL === 'IT') { labelNew = "Nuovo"; labelConfirm = "Conferma"; labelReplay = "Ripeti"; labelReset = "Ripristina"; }

    var nSpan = document.querySelector('#btn-new .l'); if(nSpan) nSpan.innerText = labelNew;
    var cSpan = document.querySelector('#btn-confirm .l'); if(cSpan) cSpan.innerText = labelConfirm;
    var rSpan = document.querySelector('#btn-replay .l'); if(rSpan) rSpan.innerText = labelReplay;
    var rsSpan = document.querySelector('#btn-reset .l'); if(rsSpan) rsSpan.innerText = labelReset;

    var targetTxt = document.getElementById('target-text');
    if (targetTxt) targetTxt.innerText = t.ready;
}

window.addEventListener('DOMContentLoaded', function() {
    bPiano();
    loadS();
    tUI();
    if(curCat) {
        uType(curCat);
    } else {
        uType('triad');
    }
});
</script>

<script>
function initCategorySelector() {
    try {
        curCat = curCat || 'quad';
        if(!cfg[curCat] || cfg[curCat].length === 0) curCat = 'quad';
        var actC = document.getElementById('c-' + curCat);
        if(actC) actC.classList.add('active');
        uType(curCat);
    } catch(err) {
        curCat = 'quad';
        var actC = document.getElementById('c-quad');
        if(actC) actC.classList.add('active');
        uType('quad');
    }
}

var pianoContainer = document.getElementById('piano-container');
if (pianoContainer) {
    pianoContainer.onpointerdown = function(e){
        var el = e.target.closest('.key');
        if(!el || !chal || step >= chal.t) return;
        if(ctx && ctx.state === 'suspended') ctx.resume();

        var kO = null;
        for(var i = 0; i < keys.length; i++){
            if(keys[i].el === el){ kO = keys[i]; break; }
        }
        if(!kO) return;

        var sD = chal.s[step];
        var langData = i18n[curL] || i18n['EN'];
        var noteArray = langData[sD.uS ? 'nS' : 'nB'] || langData['nB'];
        var nN = noteArray[kO.nI];

        if(el.classList.toggle('step-' + step)) {
            playO.push(nN);
        } else {
            var idx = playO.indexOf(nN);
            if(idx !== -1) playO.splice(idx, 1);
        }
        uDeb();
    };
}

var btnNew = document.getElementById('btn-new');
if (btnNew) {
    btnNew.onclick = function(){
        var aC = document.querySelector('.cat-toggle.active');
        if(!aC) return;
        curCat = aC.dataset.cat;

        var tActive = document.querySelectorAll('.type-toggle.active');
        if(!tActive.length) return;

        var btnReplay = document.getElementById('btn-replay');
        var btnConfirm = document.getElementById('btn-confirm');
        if(btnReplay) btnReplay.style.display = "none";
        if(btnConfirm) btnConfirm.style.display = "block";

        var ks = document.querySelectorAll('.key');
        for(var i = 0; i < ks.length; i++){
            ks[i].className = ks[i].className.split(' ').filter(function(x){
                return ['key','white','black'].indexOf(x) !== -1;
            }).join(' ');
        }

        var pool = Object.keys(scaleTable);
        var rName = "", tId = "";
        var maxAttempts = 50, attempts = 0;

        while(attempts < maxAttempts) {
            rName = pool[Math.floor(Math.random() * pool.length)];
            tId = tActive[Math.floor(Math.random() * tActive.length)].dataset.id;
            var sig = rName + "_" + tId;
            if(chordHistoryQueue.indexOf(sig) === -1) {
                chordHistoryQueue.push(sig);
                if(chordHistoryQueue.length > 2) chordHistoryQueue.shift();
                break;
            }
            attempts++;
        }

        var sq = [];
        function cS(r, id, cat){
            var res = getN(r, id, cat);
            var list = cfg[cat] || [], labelObj = null;
            for(var i = 0; i < list.length; i++){
                if(list[i].id === id){ labelObj = list[i]; break; }
            }
            var targetLabel = labelObj ? labelObj.l : id;
            var rN = r;

            if (id === 'maj' || id === 'dom7' || id === 'ealt' || id === '7sus' || id === 'alt' || id === 'dom7b9' || id === 'sus4' || id === 'maj7' || id === 'emaj' || id === 'edom7') {
                if(r === 'C#' || r === 'F#' || r === 'Db') {
                    rN = r;
                } else {
                    var midiIdx = getMidiIdx(r);
                    rN = midiIdx !== -1 ? forceEnglishRoots[midiIdx % 12] : r;
                }
            }
            if (id === 'min7' || id === 'm7b5' || id === 'dim7' || id === 'dim' || id === 'emin7' || id === 'em7b5' || id === 'edim7') {
                if (rN === 'Db' || rN === 'C#') rN = 'C#';
            }

            var dN = rN + ' ' + targetLabel + (res ? res.suf : "");
            var sharpRoots = 'D.A.E.B.F#.C#'.split('.');
            var isSharpRoot = sharpRoots.indexOf(rN) !== -1 || id.indexOf('alt') !== -1 || id.indexOf('aug') !== -1;
            return {dT: dN, dN: dN, n: (res ? res.n : []), uS: isSharpRoot};
        }

        sq.push(cS(rName, tId, curCat));
        chal = {s: sq, t: sq.length};
        step = 0;
        sStep();
    };
}

var btnConfirm = document.getElementById('btn-confirm');
if (btnConfirm) {
    btnConfirm.onclick = function(){
        if(!chal || step >= chal.t) return;
        var sD = chal.s[step], onP = [];
        var keysEl = document.querySelectorAll('.key');

        for(var i = 0; i < keysEl.length; i++){
            if(keysEl[i].classList.contains('step-' + step)) {
                onP.push(parseInt(keysEl[i].dataset.idx, 10) % 12);
            }
        }

        var tI = [];
        for(var j = 0; j < sD.n.length; j++) {
            var idx = getMidiIdx(sD.n[j]) % 12;
            if(idx >= 0 && tI.indexOf(idx) === -1) tI.push(idx);
        }

        var allGood = true;
        if(onP.length !== tI.length) {
            allGood = false;
        } else {
            for(var k = 0; k < tI.length; k++){
                if(onP.indexOf(tI[k]) === -1) allGood = false;
            }
        }

        var targetText = document.getElementById('target-text');
        if(allGood){
            playChord(sD.n, false);
            step++;
            saveS();
            if(step < chal.t) {
                setTimeout(sStep, 800);
            } else {
                if (targetText) targetText.innerText = "OK!";
                var btnConf = document.getElementById('btn-confirm');
                var btnRepl = document.getElementById('btn-replay');
                if (btnConf) btnConf.style.display = "none";
                if (btnRepl) btnRepl.style.display = "block";

                var autoCb = document.getElementById('auto-cb');
                if(autoCb && autoCb.checked) {
                    setTimeout(function(){
                        var bNew = document.getElementById('btn-new');
                        if (bNew) bNew.click();
                    }, 2500);
                }
            }
        } else {
            if (targetText) targetText.style.color = "#f44";
        }
    };
}

var btnReplay = document.getElementById('btn-replay');
if (btnReplay) {
    btnReplay.onclick = function(){
        if(chal && chal.s && chal.s[chal.t - 1]) {
            playChord(chal.s[chal.t - 1].n, false);
        }
    };
}

var catsBtns = document.querySelectorAll('.cat-toggle');
for(var i = 0; i < catsBtns.length; i++){
    catsBtns[i].onclick = function(){
        for(var j = 0; j < catsBtns.length; j++) catsBtns[j].classList.remove('active');
        this.classList.add('active');
        uType(this.dataset.cat);
        var bNew = document.getElementById('btn-new');
        if (bNew) bNew.click();
    };
}

var langSelect = document.getElementById('lang-select');
if (langSelect) {
    langSelect.onchange = function(e){
        curL = e.target.value;
        tUI();
        saveS();
        var bNew = document.getElementById('btn-new');
        if (bNew) bNew.click();
    };
}

if(document.getElementById('root-cb')) document.getElementById('root-cb').onchange = saveS;
if(document.getElementById('play-cb')) document.getElementById('play-cb').onchange = saveS;
if(document.getElementById('auto-cb')) document.getElementById('auto-cb').onchange = saveS;

var voiceSelect = document.getElementById('voice-select');
if (voiceSelect) {
    voiceSelect.onchange = function() {
        saveS();
        var bNew = document.getElementById('btn-new');
        if (bNew) bNew.click();
    };
}

var triadNoteSelect = document.getElementById('triad-note-select');
if (triadNoteSelect) {
    triadNoteSelect.onchange = function() {
        saveS();
        var bNew = document.getElementById('btn-new');
        if (bNew) bNew.click();
    };
}

var targetTextEl = document.getElementById('target-text');
if (targetTextEl) {
    targetTextEl.onclick = function() { deb = !deb; uDeb(); };
}

var btnReset = document.getElementById('btn-reset');
if (btnReset) {
    btnReset.onclick = function() { localStorage.removeItem('chordProCfg'); location.reload(); };
}

window.addEventListener('DOMContentLoaded', function() {
    initCategorySelector();
});
</script>
</body>
